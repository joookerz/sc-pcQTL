name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  launcher-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate portable installer and launcher
        run: |
          bash -n install.sh bin/sc-pcqtl tests/test_installer.sh tests/test_launcher.sh
          bash install.sh --help >/dev/null
          tests/test_installer.sh
          tests/test_launcher.sh

  nextflow-lint:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        java: ['17', '21']
        nextflow: ['25.10.0', '25.10.7', '26.04.6']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
        env:
          NXF_VER: ${{ matrix.nextflow }}
      - name: Validate configuration and syntax
        run: |
          nextflow -version
          nextflow config -flat . >/dev/null
          nextflow lint main.nf

  build-core:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
        env:
          NXF_VER: 25.10.7
      - uses: docker/setup-buildx-action@v3
      - name: Build core image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/core/Dockerfile
          push: false
          load: true
          tags: sc-pcqtl-core:test
      - name: Unit tests
        run: docker run --rm -v "$PWD:/workspace" -w /workspace sc-pcqtl-core:test Rscript tests/testthat.R
      - name: Core workflow integration tests
        env:
          SCPCQTL_TEST_PROFILE: test,docker
          SCPCQTL_TEST_CONTAINER: sc-pcqtl-core:test
        run: tests/run_core_integration.sh --core_container sc-pcqtl-core:test
      - name: Build mock SAIGE-QTL test image
        run: |
          docker build \
            --build-arg BASE_IMAGE=sc-pcqtl-core:test \
            --file tests/containers/saige-mock.Dockerfile \
            --tag sc-pcqtl-saige-mock:test .
      - name: QTL workflow integration test
        env:
          SCPCQTL_TEST_PROFILE: test,docker
          SCPCQTL_TEST_CONTAINER: sc-pcqtl-core:test
        run: |
          tests/run_qtl_mock_integration.sh \
            --core_container sc-pcqtl-core:test \
            --saige_container sc-pcqtl-saige-mock:test
